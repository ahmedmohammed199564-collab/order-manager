<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة الطلبات</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ---------------------------------------------------------------
   طبقة التوكِنز
   تخطيط: قائمة جانبية ثابتة + محتوى رئيسي يتبدّل حسب التبويب (SPA بسيطة)
----------------------------------------------------------------*/
:root{
  --bg:#F6F3FF;
  --surface:#FFFFFF;
  --surface-2:#F1ECFC;
  --border:#E6DEF7;
  --ink:#241B3B;
  --ink-muted:#7B6F99;
  --accent:#7C3AED;
  --accent-ink:#FFFFFF;
  --accent-soft:#EFE6FD;
  --accent-2:#EC4899;
  --accent-3:#06B6D4;
  --warn:#D97706;
  --warn-soft:#FDEFD9;
  --danger:#E11D48;
  --danger-soft:#FCE1E8;
  --success:#059669;
  --success-soft:#D9F5E7;
  --info:#2563EB;
  --info-soft:#DCE8FC;
  --grad-brand:linear-gradient(135deg,#7C3AED 0%,#EC4899 100%);
  --grad-sidebar:linear-gradient(165deg,#4C1D95 0%,#7C3AED 55%,#DB2777 100%);
  --font-display:'El Messiri', 'Segoe UI', Tahoma, sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --shadow:0 2px 6px rgba(124,58,237,.08), 0 14px 32px -16px rgba(124,58,237,.3);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15101F; --surface:#1E1830; --surface-2:#271F3D; --border:#352A52;
    --ink:#F1ECFC; --ink-muted:#A89BC9; --accent:#A78BFA; --accent-ink:#1A1030;
    --accent-soft:#2E2350; --accent-2:#F472B6; --accent-3:#22D3EE;
    --warn:#FBBF24; --warn-soft:#3A2A12; --danger:#FB7185; --danger-soft:#3D1824;
    --success:#34D399; --success-soft:#123426; --info:#60A5FA; --info-soft:#122A4A;
    --grad-brand:linear-gradient(135deg,#A78BFA 0%,#F472B6 100%);
    --grad-sidebar:linear-gradient(165deg,#2E1065 0%,#5B21B6 55%,#9D174D 100%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15101F; --surface:#1E1830; --surface-2:#271F3D; --border:#352A52;
  --ink:#F1ECFC; --ink-muted:#A89BC9; --accent:#A78BFA; --accent-ink:#1A1030;
  --accent-soft:#2E2350; --accent-2:#F472B6; --accent-3:#22D3EE;
  --warn:#FBBF24; --warn-soft:#3A2A12; --danger:#FB7185; --danger-soft:#3D1824;
  --success:#34D399; --success-soft:#123426; --info:#60A5FA; --info-soft:#122A4A;
  --grad-brand:linear-gradient(135deg,#A78BFA 0%,#F472B6 100%);
  --grad-sidebar:linear-gradient(165deg,#2E1065 0%,#5B21B6 55%,#9D174D 100%);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  direction:rtl;
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(124,58,237,.14), transparent 60%),
    radial-gradient(800px 480px at -10% 10%, rgba(236,72,153,.12), transparent 55%),
    radial-gradient(700px 500px at 50% 110%, rgba(6,182,212,.10), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.nav-label{font-family:var(--font-display)}
h1,h2,h3{text-wrap:balance;margin:0}
.tabular{font-variant-numeric:tabular-nums}
button{font-family:inherit}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}

/* ---------- تخطيط ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:0 0 230px;background:var(--grad-sidebar);border-left:1px solid rgba(255,255,255,.08);
  padding:20px 16px;padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px;position:sticky;top:0;align-self:flex-start;
  height:100vh;overflow-y:auto;color:#fff;position:sticky;
  box-shadow:4px 0 28px -8px rgba(76,29,149,.35);
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.25) inset;
}
.brand-text{font-weight:700;font-size:16px;color:#fff}
.brand-sub{font-size:11px;color:rgba(255,255,255,.62);font-family:var(--font-body)}

nav{display:flex;flex-direction:column;gap:3px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  color:rgba(255,255,255,.72);font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid transparent;user-select:none;
}
.nav-item:hover{background:rgba(255,255,255,.10);color:#fff}
.nav-item.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.nav-icon{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:100%;height:100%}

.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);font-size:11.5px;color:rgba(255,255,255,.65)}
.sidebar-foot .btn-ghost{color:#fff}
.sidebar-foot .btn-ghost:hover{background:rgba(255,255,255,.14)}
.store-pill{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}

.main{flex:1;min-width:0;padding-bottom:40px}
.topbar{
  position:sticky;top:0;z-index:5;background:rgba(246,243,255,.82);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
  padding:18px max(20px, env(safe-area-inset-right,0px)) 14px max(20px, env(safe-area-inset-left,0px));
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}
:root[data-theme="dark"] .topbar{background:rgba(21,16,31,.78)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topbar{background:rgba(21,16,31,.78)}}
.topbar-title h1{font-size:21px;font-weight:700;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar-title p{margin:3px 0 0;color:var(--ink-muted);font-size:12.5px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.content{padding:4px max(20px, env(safe-area-inset-right,0px)) 10px max(20px, env(safe-area-inset-left,0px))}

/* ---------- عناصر عامة ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--grad-brand);border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 16px -6px rgba(124,58,237,.55)}
.btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 20px -6px rgba(124,58,237,.65)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.icon{width:15px;height:15px;flex:none}
.icon svg{width:100%;height:100%}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:18px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--accent);transition:transform .15s ease}
.kpi:hover{transform:translateY(-2px)}
.kpis .kpi:nth-child(1){border-top-color:var(--accent)}
.kpis .kpi:nth-child(2){border-top-color:var(--success)}
.kpis .kpi:nth-child(3){border-top-color:var(--warn)}
.kpis .kpi:nth-child(4){border-top-color:var(--danger)}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-label{font-size:12px;color:var(--ink-muted);font-weight:600}
.kpi-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.kpi-icon svg{width:16px;height:16px}
.kpi-value{font-size:24px;font-weight:700}
.kpi-sub{font-size:11.5px;color:var(--ink-muted)}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.section-head h2{font-size:15px;font-weight:700}
.section-head .link{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill-new{background:var(--info-soft);color:var(--info)}
.pill-processing{background:var(--warn-soft);color:var(--warn)}
.pill-ready{background:var(--accent-soft);color:var(--accent)}
.pill-delivered{background:var(--success-soft);color:var(--success)}
.pill-cancelled{background:var(--danger-soft);color:var(--danger)}

table{width:100%;border-collapse:collapse;font-size:13px}
.table-wrap{overflow-x:auto;border-radius:14px}
thead th{text-align:right;font-size:11.5px;color:var(--ink-muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.row-main{font-weight:600}
.row-sub{color:var(--ink-muted);font-size:11.5px;margin-top:2px}
.cell-actions{display:flex;gap:6px;justify-content:flex-start}

.empty{padding:46px 20px;text-align:center;color:var(--ink-muted)}
.empty .icon-big{width:40px;height:40px;margin:0 auto 12px;opacity:.55}
.empty .icon-big svg{width:100%;height:100%}
.empty strong{display:block;color:var(--ink);margin-bottom:4px;font-size:14px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--ink-muted)}
.search input{border:none;outline:none;background:transparent;color:var(--ink);font-size:13px;width:100%;font-family:inherit}
.search .icon{opacity:.6}
.chip-filter{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-muted);cursor:pointer}
.chip.active{background:var(--grad-brand);border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 12px -4px rgba(124,58,237,.5)}

.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:4px 2px}
.bars.many{gap:4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bar-track{width:100%;height:92px;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar-fill{width:100%;background:linear-gradient(180deg,var(--accent-2),var(--accent));border-radius:5px 5px 0 0;min-height:3px}
.bar-label{font-size:10px;color:var(--ink-muted);white-space:nowrap}
.bar-value{font-size:10px;color:var(--ink-muted)}

.hbar-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.hbar-name{width:130px;flex:none;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{flex:1;height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden;min-width:0}
.hbar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:5px}
.hbar-value{width:88px;flex:none;text-align:left;font-size:12px;color:var(--ink-muted)}

.status-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:760px){.status-grid{grid-template-columns:repeat(2,1fr)}}
.status-card{padding:12px;border-radius:11px;text-align:center}
.status-card .n{font-size:19px;font-weight:700}
.status-card .l{font-size:11px;margin-top:2px}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}

.stock-low{color:var(--danger);font-weight:700}
.stock-ok{color:var(--ink-muted)}

/* ---------- نموذج/مودال ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,14,9,.42);display:flex;align-items:center;justify-content:center;padding:18px;
  padding-top:max(18px, env(safe-area-inset-top,0px));padding-bottom:max(18px, env(safe-area-inset-bottom,0px));
  z-index:50;opacity:0;pointer-events:none;transition:opacity .15s ease;
}
.overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);transform:translateY(8px);transition:transform .15s ease}
.overlay.open .modal{transform:translateY(0)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px}
.modal-head h3{font-size:16px}
.modal-body{padding:14px 20px 20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-muted)}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--bg);color:var(--ink);font-family:inherit;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-row{display:grid;grid-template-columns:1fr 64px minmax(72px,auto) 30px;gap:8px;align-items:center}
.item-row select,.item-row input{padding:8px 9px;font-size:13px}
.items-total{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px dashed var(--border);font-weight:700}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:4px 20px 20px}
.remove-row{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}

.banner{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:12.5px;margin:0 0 16px;font-weight:600}
.banner.danger{background:var(--danger-soft);color:var(--danger)}

.mobile-tabs{display:none}
@media (max-width:720px){
  .sidebar{display:none}
  .mobile-tabs{
    display:flex;flex-direction:row;flex-wrap:nowrap;align-items:stretch;
    position:fixed;bottom:0;right:0;left:0;width:100%;z-index:20;background:var(--surface);border-top:1px solid var(--border);
    padding:6px 10px 6px 10px;
    padding:6px max(10px, env(safe-area-inset-right,0px)) max(6px, env(safe-area-inset-bottom,0px)) max(10px, env(safe-area-inset-left,0px));
    justify-content:space-around;
  }
  .mobile-tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-muted);font-size:9.5px;padding:4px 6px;cursor:pointer;font-weight:600;min-width:0;position:relative}
  .mobile-tab.active{color:var(--accent)}
  .mobile-tab.active::before{content:"";position:absolute;top:-6px;right:50%;transform:translateX(50%);width:18px;height:3px;border-radius:3px;background:var(--grad-brand)}
  .mobile-tab .icon{width:18px;height:18px}
  .main{padding-bottom:78px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .status-grid{grid-template-columns:repeat(2,1fr)}
}

@media (max-width:480px){
  .topbar{padding:14px 14px 10px 14px}
  .topbar-title h1{font-size:18px}
  .content{padding:4px 14px 10px 14px}
  .kpi-value{font-size:20px}
  .field-row{grid-template-columns:1fr}
  .item-row{grid-template-columns:1fr auto auto;grid-template-areas:"product product product" "qty sub remove";row-gap:6px}
  .item-row .item-product{grid-area:product}
  .item-row .item-qty{grid-area:qty;width:64px}
  .item-row .item-sub{grid-area:sub;text-align:right!important;padding-left:0!important}
  .item-row .remove-row{grid-area:remove}
  .modal{max-width:100%;border-radius:14px 14px 0 0}
  .overlay{padding:0;align-items:flex-end}
  .overlay .modal{max-height:92vh}
  .modal-head,.modal-body,.modal-foot{padding-right:16px;padding-left:16px}
  .hbar-name{width:92px}
  .toolbar{flex-direction:column;align-items:stretch}
  .chip-filter{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .auth-card,.expired-card{padding:22px 18px}
}

/* ---------- دخول / تجربة مجانية / اشتراك ---------- */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  padding-top:max(24px, env(safe-area-inset-top,0px));padding-bottom:max(24px, env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(900px 600px at 15% 0%, rgba(124,58,237,.30), transparent 55%),
    radial-gradient(800px 600px at 100% 100%, rgba(236,72,153,.26), transparent 55%),
    var(--grad-sidebar);
}
.auth-card{width:100%;max-width:380px;padding:30px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px -20px rgba(45,10,90,.45)}
.auth-card .brand-mark{background:var(--grad-brand);color:#fff;box-shadow:none}
.auth-card .brand-text,.auth-card .brand-sub{color:var(--ink)}
.auth-card .brand-sub{color:var(--ink-muted)}
.auth-tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-muted);cursor:pointer}
.auth-tab.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.auth-error{background:var(--danger-soft);color:var(--danger);border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600}
.auth-note{font-size:11.5px;color:var(--ink-muted);text-align:center;line-height:1.6}
.trial-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--grad-brand);color:#fff;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:700;margin:0 0 16px;flex-wrap:wrap;box-shadow:0 6px 16px -6px rgba(124,58,237,.45)}
.expired-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  padding-top:max(24px, env(safe-area-inset-top,0px));padding-bottom:max(24px, env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(900px 600px at 85% 0%, rgba(236,72,153,.28), transparent 55%),
    radial-gradient(800px 600px at 0% 100%, rgba(124,58,237,.28), transparent 55%),
    var(--grad-sidebar);
}
.expired-card{width:100%;max-width:420px;padding:34px 28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 30px 60px -20px rgba(45,10,90,.45)}
.expired-price{font-size:30px;font-weight:700;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.pay-box{background:var(--surface-2);border-radius:10px;padding:14px;width:100%;text-align:right;font-size:13px;display:flex;flex-direction:column;gap:7px;line-height:1.6}
</style>
</head>
<body>

<div class="app" id="app-shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ط</div>
      <div>
        <div class="brand-text">إدارة الطلبات</div>
        <div class="brand-sub">لصاحب المشروع الصغير</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="store-pill" id="storage-status"><span class="dot"></span><span>جاري الاتصال بقاعدة البيانات…</span></div>
      <button class="btn btn-ghost btn-sm" id="btn-notif-toggle" style="width:100%;margin-top:8px;justify-content:center"></button>

function notifySupported(){ return typeof window!=='undefined' && 'Notification' in window; }

function sendOrderNotification(title, body){

async function initStorage(){
  const statusEl = document.getElementById('storage-status');

  if(!SUPABASE_URL || SUPABASE_URL.indexOf('PASTE_YOUR')===0){
    state.writable = false;
    authState.checked = true;
    statusEl.innerHTML = '<span class="dot" style="background:var(--danger)"></span><span>التخزين غير مظبوط بعد</span>';
    renderRoot();
    return;
  }

  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){
    state.writable = false; authState.checked = true;
    statusEl.innerHTML = '<span class="dot" style="background:var(--danger)"></span><span>تعذّر الاتصال بقاعدة البيانات</span>';
    renderRoot();
    return;
  }

  sb.auth.onAuthStateChange((_event, session)=>{ handleAuthChange(session); });
  const { data:{ session } } = await sb.auth.getSession();
  await handleAuthChange(session);
}

async function handleAuthChange(session){
  authState.session = session;
  authState.checked = true;
  if(session){
    await ensureProfile(session.user.id);
    if(isActive(authState.profile)){
      await fetchAll();
      const statusEl = document.getElementById('storage-status');
      if(statusEl) statusEl.innerHTML = '<span class="dot"></span><span>متصل ويحفظ تلقائيًا</span>';
    }
  } else {
    authState.profile = null;
    state.customers = []; state.products = []; state.orders = []; state.ready = false;
  }
  renderRoot();
}

async function ensureProfile(uid){
  try{
    const { data } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
    if(data){ authState.profile = data; return; }
    const { data:created } = await sb.from('profiles').insert({ id:uid, trial_start:new Date().toISOString() }).select().maybeSingle();
    authState.profile = created || { id:uid, trial_start:new Date().toISOString(), paid_until:null };
  }catch(e){
    authState.profile = { id:uid, trial_start:new Date().toISOString(), paid_until:null };
  }
}

function isActive(profile){
  if(!profile) return false;
  const now = Date.now();
  const trialEnd = new Date(profile.trial_start).getTime() + TRIAL_DAYS*24*60*60*1000;
  const paidActive = !!profile.paid_until && (new Date(profile.paid_until+'T23:59:59').getTime() >= now);
  return now < trialEnd || paidActive;
}
function trialDaysLeft(profile){
  const trialEnd = new Date(profile.trial_start).getTime() + TRIAL_DAYS*24*60*60*1000;
  return Math.max(0, Math.ceil((trialEnd - Date.now())/(24*60*60*1000)));
}
async function doLogout(){
  if(sb) await sb.auth.signOut();
}

/* ---------------------------------------------------------------
   شاشة تسجيل الدخول / حساب جديد
----------------------------------------------------------------*/
function translateAuthError(msg){
  msg = msg || '';
  if(/already registered|already exists/i.test(msg)) return 'الإيميل ده مسجّل بالفعل، جرّب "تسجيل الدخول"';
  if(/invalid login|invalid credentials/i.test(msg)) return 'الإيميل أو كلمة المرور غلط';
  if(/confirm/i.test(msg)) return 'لازم تأكّد بريدك الإلكتروني الأول من الرسالة اللي وصلتك';
  if(/password/i.test(msg)) return 'كلمة المرور لازم تكون 6 أحرف على الأقل';
  return 'حصل خطأ، حاول تاني';
}

function renderAuthScreen(){
  const el = document.getElementById('auth-root');
  const isLogin = authState.authView==='login';
  el.innerHTML = `
    <div class="card auth-card">
      <div class="brand" style="justify-content:center">
        <div class="brand-mark">ط</div>
        <div>
          <div class="brand-text">إدارة الطلبات</div>
          <div class="brand-sub">لصاحب المشروع الصغير</div>
        </div>
      </div>
      <div class="auth-tabs">
        <div class="auth-tab ${isLogin?'active':''}" data-auth-tab="login">تسجيل الدخول</div>
        <div class="auth-tab ${!isLogin?'active':''}" data-auth-tab="signup">حساب جديد</div>
      </div>
      ${authState.authError?`<div class="auth-error">${esc(authState.authError)}</div>`:''}
      <form id="auth-form" style="display:flex;flex-direction:column;gap:12px">
        <div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required placeholder="name@example.com"></div>
        <div class="field"><label>كلمة المرور</label><input name="password" type="password" required minlength="6" placeholder="6 أحرف على الأقل"></div>
        <button type="submit" class="btn btn-primary" style="justify-content:center">${isLogin?'دخول':`إنشاء حساب (تجربة ${TRIAL_DAYS} أيام مجانًا)`}</button>
      </form>
      <div class="auth-note">${isLogin?'لسه معندكش حساب؟ اضغط "حساب جديد" فوق':`باشتراك شهري ${SUBSCRIPTION_PRICE} بعد انتهاء التجربة المجانية`}</div>
    </div>`;

  el.querySelectorAll('[data-auth-tab]').forEach(t=>{
    t.addEventListener('click', ()=>{
      authState.authView = t.dataset.authTab;
      authState.authError = '';
      renderAuthScreen();
    });
  });

  document.getElementById('auth-form').addEventListener('submit', async e=>{
    e.preventDefault();
    authState.authError = '';
    const f = new FormData(e.target);
    const email = (f.get('email')||'').trim();
    const password = f.get('password')||'';
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    try{
      if(isLogin){
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      } else {
        const { error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
      }
    }catch(err){
      authState.authError = translateAuthError(err && err.message);
      btn.disabled = false;
      renderAuthScreen();
    }
  });
}

/* ---------------------------------------------------------------
   الموزّع الرئيسي بين شاشات الدخول/الاشتراك/التطبيق
----------------------------------------------------------------*/
function renderRoot(){
  const appEl = document.getElementById('app-shell');
  const authEl = document.getElementById('auth-root');
  const expiredEl = document.getElementById('expired-root');

  if(!authState.checked){
    appEl.hidden = true; authEl.hidden = true; expiredEl.hidden = true;
    return;
  }
  if(!sb){
    appEl.hidden = false; authEl.hidden = true; expiredEl.hidden = true;
    state.ready = true;
    render();
    return;
  }
  if(!authState.session){
    appEl.hidden = true; expiredEl.hidden = true; authEl.hidden = false;
    renderAuthScreen();
    return;
  }
  if(!isActive(authState.profile)){
    appEl.hidden = true; authEl.hidden = true; expiredEl.hidden = false;
    renderExpiredScreen();
    return;
  }
  appEl.hidden = false; authEl.hidden = true; expiredEl.hidden = true;
  render();
}

async function fetchAll(){
  try{
    const [c,p,o] = await Promise.all([
      sb.from('customers').select('*').order('created_at',{ascending:false}),
      sb.from('products').select('*').order('created_at',{ascending:false}),
      sb.from('orders').select('*').order('created_at',{ascending:false}),
    ]);
    if(c.error || p.error || o.error) throw (c.error||p.error||o.error);
    state.customers = (c.data||[]).map(normCustomer);
    state.products  = (p.data||[]).map(normProduct);
    state.orders    = (o.data||[]).map(normOrder);
    state.ready = true;
    render();
  }catch(e){
    state.ready = true;
    state.writable = false;
    const statusEl = document.getElementById('storage-status');
    statusEl.innerHTML = '<span class="dot" style="background:var(--danger)"></span><span>تعذّر تحميل البيانات</span>';
    render();
  }
}
function normCustomer(r){ return {id:r.id, name:r.name, phone:r.phone, address:r.address, createdAt:r.created_at}; }
function normProduct(r){ return {id:r.id, name:r.name, price:r.price, stock:r.stock, unit:r.unit, createdAt:r.created_at}; }
function normOrder(r){ return {id:r.id, customerId:r.customer_id, customerName:r.customer_name, customerPhone:r.customer_phone, items:r.items||[], total:r.total, status:r.status, notes:r.notes, createdAt:r.created_at}; }

/* ---------------------------------------------------------------
   عمليات الكتابة (CRUD)
----------------------------------------------------------------*/
async function createCustomer(data){
  await sb.from('customers').insert({name:data.name, phone:data.phone, address:data.address});
  await fetchAll();
}
async function updateCustomer(id, data){
  await sb.from('customers').update({name:data.name, phone:data.phone, address:data.address}).eq('id', id);
  await fetchAll();
}
async function deleteCustomer(id){
  await sb.from('customers').delete().eq('id', id);
  await fetchAll();
}

async function createProduct(data){
  await sb.from('products').insert({name:data.name, price:data.price, stock:data.stock, unit:data.unit});
  await fetchAll();
}
async function updateProduct(id, data){
  await sb.from('products').update({name:data.name, price:data.price, stock:data.stock, unit:data.unit}).eq('id', id);
  await fetchAll();
}
async function deleteProduct(id){
  await sb.from('products').delete().eq('id', id);
  await fetchAll();
}

async function createOrder(data){
  await sb.from('orders').insert({
    customer_id:data.customerId, customer_name:data.customerName, customer_phone:data.customerPhone,
    items:data.items, total:data.total, status:data.status, notes:data.notes,
  });
  for(const item of data.items){
    const p = state.products.find(x=>x.id===item.productId);
    if(p){
      const newStock = Math.max(0, (Number(p.stock)||0) - Number(item.qty||0));
      await sb.from('products').update({stock:newStock}).eq('id', p.id);
    }
  }
  await fetchAll();
  sendOrderNotification('طلب جديد ✅', `${data.customerName||'عميل'} — إجمالي ${money(data.total)}`);
}
async function updateOrderStatus(id, status){
  await sb.from('orders').update({status}).eq('id', id);
  await fetchAll();
  const o = state.orders.find(x=>x.id===id);
  const label = STATUS[status] ? STATUS[status].label : status;
  sendOrderNotification('تحديث حالة طلب', `${o?(o.customerName||'عميل'):'طلب'} — بقت الحالة: ${label}`);
}
async function deleteOrder(id){
  await sb.from('orders').delete().eq('id', id);
  await fetchAll();
}

----------------------------------------------------------------*/
function isToday(iso){ const d=new Date(iso), t=new Date(); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate(); }
function isThisMonth(iso){ const d=new Date(iso), t=new Date(); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth(); }
function activeOrders(){ return state.orders.filter(o=>o.status!=='cancelled'); }

function revenueByDay(days){
  const buckets = [];
  for(let i=days-1;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    buckets.push({date:d, total:0, label:d.toLocaleDateString('ar-EG',{weekday:'short'})});
  }
  activeOrders().forEach(o=>{
    const od = new Date(o.createdAt); od.setHours(0,0,0,0);
    const b = buckets.find(x=>x.date.getTime()===od.getTime());
    if(b) b.total += Number(o.total)||0;
  });
  return buckets;
}
function topProducts(limit){
  const map = {};
  activeOrders().forEach(o=>(o.items||[]).forEach(it=>{
    map[it.name] = (map[it.name]||0) + (Number(it.price)||0)*(Number(it.qty)||0);
  }));
  return Object.entries(map).map(([name,total])=>({name,total})).sort((a,b)=>b.total-a.total).slice(0,limit);
}
function statusCounts(){
  const c = {}; STATUS_ORDER.forEach(s=>c[s]=0);
  state.orders.forEach(o=>{ c[o.status]=(c[o.status]||0)+1; });
  return c;
}

/* ---------------------------------------------------------------
   عناصر واجهة مشتركة
----------------------------------------------------------------*/
function emptyState(iconName, title, sub){
  return `<div class="card empty">
    <div class="icon-big" style="color:var(--ink-muted)">${icon(iconName)}</div>
    <strong>${esc(title)}</strong>
    <div>${esc(sub)}</div>
  </div>`;
}
function statusPill(status){ const s = STATUS[status] || STATUS.new; return `<span class="pill ${s.cls}">${s.label}</span>`; }
function bars(buckets){
  const max = Math.max(1, ...buckets.map(b=>b.total));
  return `<div class="bars ${buckets.length>10?'many':''}">${buckets.map(b=>`
    <div class="bar-col">
      <div class="bar-track"><div class="bar-fill" style="height:${Math.max(4,(b.total/max)*100)}%"></div></div>
      <div class="bar-value tabular">${b.total?money(b.total).replace(' ج.م',''):''}</div>
      <div class="bar-label">${esc(b.label)}</div>
    </div>`).join('')}</div>`;
}
function hbars(rows){
  const max = Math.max(1, ...rows.map(r=>r.total));
  return rows.map(r=>`
    <div class="hbar-row">
      <div class="hbar-name">${esc(r.name)}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(4,(r.total/max)*100)}%"></div></div>
      <div class="hbar-value tabular">${money(r.total)}</div>
    </div>`).join('');
}

function modalOrder(){
  if(!state.customers.length || !state.products.length){
    const missing = !state.customers.length && !state.products.length
      ? 'لسه مضفتش ولا عميل ولا منتج'
      : (!state.customers.length ? 'لسه مضفتش ولا عميل' : 'لسه مضفتش ولا منتج');
    openModal(`
      <div class="modal-head"><h3>مينفعش تضيف طلب دلوقتي</h3>
        <button class="btn btn-ghost btn-sm" data-close><span class="icon">${icon('close')}</span></button></div>
      <div class="modal-body">
        <div class="banner" style="margin:0">${icon('warn')} ${missing}. لازم تضيف عميل واحد ومنتج واحد على الأقل الأول عشان تقدر تسجّل طلب.</div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-primary" data-close>تمام</button>
      </div>`);
    return;
  }
  let rows = [{productId:state.products[0].id, qty:1}];

  function itemRowHtml(row, idx){
    return `<div class="item-row" data-idx="${idx}">
      <select class="item-product">
        ${state.products.map(p=>`<option value="${p.id}" ${row.productId===p.id?'selected':''}>${esc(p.name)} — ${money(p.price)}</option>`).join('')}
      </select>
      <input class="item-qty" type="number" min="1" step="1" value="${row.qty}">
      <div class="item-sub tabular row-sub" style="text-align:left;padding-left:4px"></div>
      <button type="button" class="remove-row" data-remove="${idx}">${icon('close')}</button>
    </div>`;
  }
  function renderItems(){
    const wrap = document.getElementById('order-items');
    if(!wrap) return;
    wrap.innerHTML = rows.map(itemRowHtml).join('');
    updateSubtotals();
  }
  function updateSubtotals(){
    let total = 0;
    document.querySelectorAll('#order-items .item-row').forEach((rowEl)=>{
      const pid = rowEl.querySelector('.item-product').value;
      const qty = Number(rowEl.querySelector('.item-qty').value)||0;
      const p = state.products.find(x=>x.id===pid);
      const sub = (p?Number(p.price):0)*qty;
      rowEl.querySelector('.item-sub').textContent = money(sub);
      total += sub;
    });
    const totalEl = document.getElementById('order-total-value');
    if(totalEl) totalEl.textContent = money(total);
  }

  openModal(`
    <div class="modal-head"><h3>طلب جديد</h3>
      <button class="btn btn-ghost btn-sm" data-close><span class="icon">${icon('close')}</span></button></div>
    <form id="order-form" class="modal-body">
      <div class="field"><label>العميل</label>
        <select name="customerId" id="order-customer">
          ${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>الأصناف</label>
        <div id="order-items" style="display:flex;flex-direction:column;gap:8px"></div>
        <button type="button" class="btn btn-sm" id="add-item-row" style="align-self:flex-start;margin-top:4px">
          <span class="icon">${icon('plus')}</span> إضافة صنف
        </button>
      </div>
      <div class="field"><label>ملاحظات (اختياري)</label><textarea name="notes" rows="2" placeholder="مواعيد تسليم أو طلبات خاصة"></textarea></div>
      <div class="items-total"><span>الإجمالي</span><span id="order-total-value" class="tabular">0 ج.م</span></div>
      <div class="modal-foot" style="padding:0">
        <button type="button" class="btn" data-close>إلغاء</button>
        <button type="submit" class="btn btn-primary">إنشاء الطلب</button>
      </div>
    </form>`);

  renderItems();

  document.getElementById('add-item-row').addEventListener('click', ()=>{
    rows.push({productId:state.products[0].id, qty:1});
    renderItems();
  });
  document.getElementById('order-items').addEventListener('click', e=>{
    const btn = e.target.closest('[data-remove]');
    if(!btn) return;
    const idx = Number(btn.dataset.remove);
    if(rows.length>1){ rows.splice(idx,1); renderItems(); }
  });
  document.getElementById('order-items').addEventListener('input', e=>{
    const rowEl = e.target.closest('.item-row');
    if(!rowEl) return;
    const idx = Number(rowEl.dataset.idx);
    if(e.target.classList.contains('item-product')) rows[idx].productId = e.target.value;
    if(e.target.classList.contains('item-qty')) rows[idx].qty = Math.max(1, Number(e.target.value)||1);
    updateSubtotals();
  });
  document.getElementById('order-items').addEventListener('change', e=>{
    if(e.target.classList.contains('item-product')){
      const rowEl = e.target.closest('.item-row');
      const idx = Number(rowEl.dataset.idx);
      rows[idx].productId = e.target.value;
      updateSubtotals();
    }
  });

  document.getElementById('order-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const customerId = f.get('customerId');
    const customer = state.customers.find(c=>c.id===customerId);
    const items = rows.map(r=>{
      const p = state.products.find(x=>x.id===r.productId);
      return {productId:r.productId, name:p?p.name:'', qty:r.qty, price:p?Number(p.price):0};
    }).filter(it=>it.qty>0);
    if(!items.length || !customer) return;
    const total = items.reduce((s,it)=>s+it.qty*it.price,0);
    await createOrder({
      customerId, customerName:customer.name, customerPhone:customer.phone||'',
      items, total, status:'new', notes:(f.get('notes')||'').trim()
    });
    closeModal();
  });
}

    const b = document.getElementById('btn-new-order');
    if(b && canOrder) b.addEventListener('click', ()=>modalOrder());
  } else if(state.view==='customers'){
    el.innerHTML = `<button class="btn btn-primary" id="btn-new-customer" ${state.writable?'':'disabled style="opacity:.5"'}><span class="icon">${icon('plus')}</span> عميل جديد</button>`;
    const b = document.getElementById('btn-new-customer');
    if(b && state.writable) b.addEventListener('click', ()=>modalCustomer(null));
  } else if(state.view==='inventory'){
    el.innerHTML = `<button class="btn btn-primary" id="btn-new-product" ${state.writable?'':'disabled style="opacity:.5"'}><span class="icon">${icon('plus')}</span> منتج جديد</button>`;
    const b = document.getElementById('btn-new-product');
    if(b && state.writable) b.addEventListener('click', ()=>modalProduct(null));
  } else {
    el.innerHTML = '';
  }
}

/* ---------------------------------------------------------------
   التنقل والعرض الرئيسي
----------------------------------------------------------------*/
function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(n=>`
    <div class="nav-item ${state.view===n.id?'active':''}" data-nav="${n.id}">
      <span class="nav-icon">${icon(n.icon)}</span><span class="nav-label">${n.label}</span>
    </div>`).join('');
  document.getElementById('mobile-nav').innerHTML = NAV.map(n=>`
    <div class="mobile-tab ${state.view===n.id?'active':''}" data-nav="${n.id}">
      <span class="icon">${icon(n.icon)}</span><span>${n.label}</span>
    </div>`).join('');

  const notifBtn = document.getElementById('btn-notif-toggle');
  if(notifBtn){
    const status = notifyStatus();
    if(status==='unsupported'){
      notifBtn.style.display = 'none';
    } else {
      notifBtn.style.display = '';
      if(status==='granted'){
        notifBtn.innerHTML = `<span class="icon">${icon('bell')}</span> الإشعارات مفعّلة`;
      } else if(status==='denied'){
        notifBtn.innerHTML = `<span class="icon">${icon('bellOff')}</span> الإشعارات متبلوكة`;
      } else {
        notifBtn.innerHTML = `<span class="icon">${icon('bell')}</span> تفعيل إشعارات الطلبات`;
      }
    }
  }
}

function setView(v){
  state.view = v;
  try{ localStorage.setItem('om_last_view', v); }catch(e){}
  render();
}

function render(){
  renderNav();
  const meta = NAV.find(n=>n.id===state.view) || NAV[0];
  document.getElementById('page-title').textContent = meta.label;
  document.getElementById('page-sub').textContent = meta.sub;
  renderPageActions();

  let html = '';
  if(!state.ready){
    html = `<div class="empty"><div class="icon-big">${icon('dashboard')}</div><strong>جاري تحميل البيانات…</strong></div>`;
  } else if(state.view==='dashboard') html = viewDashboard();
  else if(state.view==='orders') html = viewOrders();
  else if(state.view==='customers') html = viewCustomers();
  else if(state.view==='inventory') html = viewInventory();
  else if(state.view==='reports') html = viewReports();

  if(!state.writable){
    const msg = (!SUPABASE_URL || SUPABASE_URL.indexOf('PASTE_YOUR')===0)
      ? 'لازم تظبط بيانات الاتصال بقاعدة البيانات في أول الكود (SUPABASE_URL و SUPABASE_ANON_KEY) قبل ما تنشر الموقع.'
      : 'تعذّر الاتصال بقاعدة البيانات. تأكد من صحة الرابط والمفتاح، ومن إنشاء الجداول بالكود اللي اتبعتلك.';
    html = `<div class="banner danger">${icon('warn')} ${msg}</div>` + html;
  } else if(authState.profile && !authState.profile.paid_until){
    const left = trialDaysLeft(authState.profile);
    html = `<div class="trial-banner"><span>باقي ${left} ${left===1?'يوم':'أيام'} من التجربة المجانية</span><span class="tabular">${SUBSCRIPTION_PRICE} شهريًا بعدها</span></div>` + html;
  }

  document.getElementById('view-root').innerHTML = html;

  const searchInput = document.getElementById('order-search');
  if(searchInput){
    searchInput.addEventListener('input', e=>{ state.orderSearch = e.target.value; renderOrdersOnly(); });
  }
}

function renderOrdersOnly(){
  const root = document.getElementById('view-root');
  if(state.view!=='orders' || !root) return;
  const hadFocus = document.activeElement===document.getElementById('order-search');
  root.innerHTML = viewOrders();
  const input = document.getElementById('order-search');
  if(input){
    input.addEventListener('input', e=>{ state.orderSearch = e.target.value; renderOrdersOnly(); });
    if(hadFocus){ input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
  }
}

/* ---------------------------------------------------------------
   تفويض الأحداث (Event delegation)
----------------------------------------------------------------*/
document.addEventListener('click', e=>{
  if(e.target.closest('#btn-logout')){ doLogout(); return; }
  if(e.target.closest('#btn-notif-toggle')){ requestOrderNotifications(); return; }
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ setView(navEl.dataset.nav); return; }
  if(e.target.closest('[data-close]')){ closeModal(); return; }

  const filterEl = e.target.closest('[data-filter]');
  if(filterEl){ state.orderFilter = filterEl.dataset.filter; renderOrdersOnly(); return; }

  const editCustomer = e.target.closest('[data-edit-customer]');
  if(editCustomer){
    const c = state.customers.find(x=>x.id===editCustomer.dataset.editCustomer);
    if(c) modalCustomer(c);
    return;
  }
  const delCustomer = e.target.closest('[data-del-customer]');
  if(delCustomer){ deleteCustomer(delCustomer.dataset.delCustomer); return; }

  const editProduct = e.target.closest('[data-edit-product]');
  if(editProduct){
    const p = state.products.find(x=>x.id===editProduct.dataset.editProduct);
    if(p) modalProduct(p);
    return;
  }
  const delProduct = e.target.closest('[data-del-product]');
  if(delProduct){ deleteProduct(delProduct.dataset.delProduct); return; }

  const delOrder = e.target.closest('[data-del-order]');
  if(delOrder){ deleteOrder(delOrder.dataset.delOrder); return; }
});

document.addEventListener('change', e=>{
  if(e.target.classList.contains('status-select')){
    updateOrderStatus(e.target.dataset.orderId, e.target.value);
  }
});

document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

/* ---------------------------------------------------------------
   بدء التشغيل
----------------------------------------------------------------*/
renderNav();
initStorage();

})();
</script>
</body>
</html>
